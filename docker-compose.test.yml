# Separate project name: never touches the main stack's containers, network or volumes.
name: chat-analyze-test

services:
  postgres:
    image: postgres:18.6-alpine3.24
    tmpfs:
      - /var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test"]
      interval: 1s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgres://postgres:test@postgres:5432/test?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
